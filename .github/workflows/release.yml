name: Release installer

# Builds the installer from a tag (v*) or by hand, signs it when signing secrets exist, and
# uploads it with a SHA-256 checksum file. Unsigned builds still work (the sign steps are
# skipped) so this can be tried before a certificate is bought, but an unsigned installer can be
# blocked by Windows Smart App Control, so the run says so loudly.
#
# To enable signing, add these repository secrets (Settings > Secrets and variables > Actions):
#   SIGNING_CERT_PFX_BASE64   the code-signing .pfx, base64-encoded:
#                             [Convert]::ToBase64String([IO.File]::ReadAllBytes('cert.pfx'))
#   SIGNING_CERT_PASSWORD     the .pfx password
#
# The secrets are only ever exposed to the two signing steps below (never job-wide), so restore, test,
# publish and the WiX tool install cannot read them. Signing only happens for tags and master, so a
# manual run on some other branch builds an unsigned installer instead of signing its code.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-installer:
    runs-on: windows-latest
    # Gate: the job waits for an approval from the environment's required reviewers before it starts,
    # and the signing secrets live in this environment (not as repository secrets), so a new tag or
    # a collaborator's manual run cannot use the certificate without sign-off.
    environment: release-signing
    env:
      # A true/false flag, not the secret itself.
      CAN_SIGN: ${{ (github.ref_type == 'tag' || github.ref == 'refs/heads/master') && secrets.SIGNING_CERT_PFX_BASE64 != '' }}
    steps:
      # Actions pinned to a full commit SHA (not a mutable tag), as in ci.yml.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      # --locked-mode: fail if any package would differ from packages.lock.json.
      - name: Restore (locked)
        run: dotnet restore AudioTunePro.slnx --locked-mode

      - name: Test
        run: dotnet test src/AudioTunePro.Core.Tests/AudioTunePro.Core.Tests.csproj --configuration Release --no-restore --verbosity normal

      - name: Publish app
        run: dotnet publish src/AudioTunePro.App/AudioTunePro.App.csproj -c Release -r win-x64 --self-contained false --no-restore -o CI-artefact

      - name: Warn when the installer will be unsigned
        if: env.CAN_SIGN != 'true'
        shell: pwsh
        run: |
          Write-Host "::warning title=Unsigned installer::No signing certificate is available for this run (add the SIGNING_CERT_* secrets and run from a tag or master). Windows Smart App Control can block unsigned AudioTune Pro builds, so do not ship this one."

      # Certificate is decoded, used and deleted inside one step; the secrets exist only in this step's environment.
      - name: Sign binaries
        if: env.CAN_SIGN == 'true'
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.SIGNING_CERT_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_BASE64))
            ./installer/sign.ps1 -Target Binaries -PfxPath $pfx -PfxPassword (ConvertTo-SecureString $env:PFX_PASSWORD -AsPlainText -Force)
          } finally {
            Remove-Item -Force $pfx -ErrorAction SilentlyContinue
          }

      - name: Build MSI
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2
          Push-Location installer
          wix build AudioTunePro.wxs -ext WixToolset.UI.wixext -arch x64 -o ../release/AudioTunePro-Setup.msi
          Pop-Location

      - name: Sign MSI
        if: env.CAN_SIGN == 'true'
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.SIGNING_CERT_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_BASE64))
            ./installer/sign.ps1 -Target Msi -PfxPath $pfx -PfxPassword (ConvertTo-SecureString $env:PFX_PASSWORD -AsPlainText -Force)
          } finally {
            Remove-Item -Force $pfx -ErrorAction SilentlyContinue
          }

      - name: Checksums
        shell: pwsh
        run: |
          Get-FileHash release/AudioTunePro-Setup.msi -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  AudioTunePro-Setup.msi" } |
            Set-Content release/SHA256SUMS.txt
          Get-Content release/SHA256SUMS.txt

      - name: Upload installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: AudioTunePro-installer
          path: release/
          if-no-files-found: error
