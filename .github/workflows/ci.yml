name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# Least-privilege default: this workflow only builds and runs tests, it never
# needs to write to the repo, open PRs, or touch packages/releases.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      # Actions pinned to a full commit SHA (not a mutable tag) so a compromised
      # or re-tagged upstream release can't silently change what runs in CI.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      # --locked-mode: the build must use exactly the package versions in packages.lock.json.
      - name: Restore (locked)
        run: dotnet restore AudioTunePro.slnx --locked-mode

      - name: Audit NuGet packages for known vulnerabilities
        shell: pwsh
        run: |
          $out = dotnet list AudioTunePro.slnx package --vulnerable --include-transitive 2>&1 | Out-String
          Write-Host $out
          if ($out -match 'has the following vulnerable packages') { throw 'Vulnerable NuGet packages found.' }

      - name: Build
        run: dotnet build AudioTunePro.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test src/AudioTunePro.Core.Tests/AudioTunePro.Core.Tests.csproj --configuration Release --no-build --verbosity normal

      # Renders the real MainWindow.xaml offscreen with a stand-in view model and checks its layout and the response
      # curve (src/AudioTunePro.App.UiTests). Nothing here touches Equalizer APO, the registry or the audio service.
      - name: UI layout tests
        run: dotnet test src/AudioTunePro.App.UiTests/AudioTunePro.App.UiTests.csproj --configuration Release --no-build --verbosity normal

      # Pictures of what those tests rendered, to work out a failure without a Windows desktop at hand.
      - name: Upload UI snapshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-snapshots
          path: src/AudioTunePro.App.UiTests/bin/Release/net10.0-windows/UiSnapshots/
          if-no-files-found: ignore
          retention-days: 7
